services:
  - type: web
    name: trading-signal-bot
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: AI_MODEL
        value: gpt-3.5-turbo
      - key: PAIR_1
        value: BTC/USDT
      - key: PAIR_2
        value: ETH/USDT
      - key: PAIR_3
        value: SOL/USDT
      - key: ACTIVE_PAIR
        value: BTC/USDT
      - key: TIMEFRAME
        value: 5m
      - key: TRADE_DURATION
        value: 60
      - key: MONITOR_INTERVAL
        value: 10
      - key: SIGNAL_MODE
        value: MANUAL
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
